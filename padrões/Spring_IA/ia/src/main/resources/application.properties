spring.application.name=ia

spring.ai.model.chat=openai
spring.ai.openai.base-url=http://127.0.0.1:1337
spring.ai.openai.api-key=no-key
spring.ai.openai.chat.model=Llama-3_2-3B-Instruct-Q4_K_M
spring.ai.openai.chat.timeout=1000s
spring.ai.openai.chat.temperature=0.1
knowledge.path=./knowledge
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=knowledge-assistant
spring.ai.vectorstore.chroma.initialize-schema=true

spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
